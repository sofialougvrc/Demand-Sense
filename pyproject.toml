[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "demand-sense"
version = "0.1.0"
description = "Retail demand forecasting and inventory optimization platform."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Sofia Cardenas Garcia" }
]
dependencies = [
  "numpy>=2.0",
  "psycopg[binary]>=3.2",
  "python-dotenv>=1.0"
]

[project.scripts]
demand-sense-cdc = "demand_sense.ingestion.cdc:main"
demand-sense-seed = "demand_sense.data_generation.seed:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "ruff>=0.6.0"
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
demand_sense = ["data_generation/*.sql"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
