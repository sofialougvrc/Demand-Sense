[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "demand-sense"
version = "0.1.0"
description = "Retail demand forecasting and inventory optimization platform."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Sofia Cardenas Garcia" }
]
dependencies = [
  "confluent-kafka>=2.6",
  "deltalake>=0.20",
  "great-expectations>=1.0",
  "numpy>=2.0",
  "pandas>=2.2",
  "pyarrow>=17.0",
  "psycopg[binary]>=3.2",
  "python-dotenv>=1.0"
]

[project.scripts]
demand-sense-bronze = "demand_sense.lakehouse.bronze:main"
demand-sense-cdc = "demand_sense.ingestion.cdc:main"
demand-sense-seed = "demand_sense.data_generation.seed:main"
demand-sense-silver = "demand_sense.lakehouse.silver:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "ruff>=0.6.0"
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
demand_sense = ["data_generation/*.sql"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
